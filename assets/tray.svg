<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Back window (#2 stack, #1 colors muted) -->
  <g transform="translate(24,8)">
    <rect width="88" height="74" rx="10" fill="#352868"/>
    <path d="M0,10 h88 v8 H0 z M0,0 h88 a10,10 0 0 0 -10,-10 H10 A10,10 0 0 0 0,0 z" fill="#1a2744"/>
    <rect x="0" y="0" width="88" height="16" rx="10" fill="#1a2744"/>
    <rect x="0" y="8" width="88" height="8" fill="#1a2744"/>
    <circle cx="12" cy="8" r="2.3" fill="#a8b0c0"/>
    <circle cx="20.5" cy="8" r="2.3" fill="#a8b0c0"/>
  </g>

  <!-- Middle window -->
  <g transform="translate(14,22)">
    <rect width="92" height="78" rx="10" fill="#4f3b9a"/>
    <rect x="0" y="0" width="92" height="17" rx="10" fill="#1e2f52"/>
    <rect x="0" y="9" width="92" height="8" fill="#1e2f52"/>
    <circle cx="13" cy="8.5" r="2.5" fill="#c5cddb"/>
    <circle cx="22" cy="8.5" r="2.5" fill="#c5cddb"/>
  </g>

  <!-- Front window (#1 dominant) -->
  <g transform="translate(4,38)">
    <rect width="98" height="82" rx="11" fill="#6b4fd6"/>
    <rect x="0" y="0" width="98" height="18" rx="11" fill="#243656"/>
    <rect x="0" y="10" width="98" height="8" fill="#243656"/>
    <circle cx="14" cy="9" r="2.7" fill="#e8eef8"/>
    <circle cx="24" cy="9" r="2.7" fill="#e8eef8"/>
    <!-- prompt ">_" as shapes -->
    <path d="M20 46 L34 54 L20 62" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="58" width="18" height="5" rx="1.5" fill="#ffffff"/>
  </g>

  <!-- #3 user + restricted badge -->
  <g transform="translate(84,84)">
    <circle cx="20" cy="20" r="19" fill="#f4f6fb" stroke="#243656" stroke-width="2.5"/>
    <circle cx="20" cy="13" r="6.5" fill="#f0d5c0" stroke="#1a1a1a" stroke-width="1.4"/>
    <path d="M12.5 12.5 Q20 5 27.5 12.5" fill="#1a1a1a"/>
    <path d="M9 33 Q9 21.5 20 20.5 Q31 21.5 31 33 Z" fill="#3b82f6" stroke="#1a1a1a" stroke-width="1.4"/>
    <g transform="translate(24,24)">
      <circle cx="9" cy="9" r="8" fill="#e11d48" stroke="#ffffff" stroke-width="1.8"/>
      <line x1="4" y1="14" x2="14" y2="4" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
