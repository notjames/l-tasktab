[package]
name = "l_tasktabs"
version = "0.1.0"
edition = "2024"
description = "L-TaskTabs — tray-resident tabbed TUI session manager"
license = "LGPL-3.0-only"
rust-version = "1.88"

[[bin]]
name = "l-tasktabs"
path = "src/main.rs"

[dependencies]
qtbridge = { version = "0.4.1", features = ["linkme", "serde_json"] }
fs2 = "0.4"
directories = "6"
# StatusNotifierItem tray (Qt Bridge is QGuiApplication-only; QWidget tray crashes)
ksni = { version = "0.3.7", features = ["blocking"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.3"
uuid = { version = "1.26.1", features = ["v4"] }
portable-pty = "0.9.0"
vt100 = "0.18.1"
anyhow = "1.0.105"
